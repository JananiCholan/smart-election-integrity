<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Election Integrity System - Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            text-align: center;
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: #7a1720;
            color: #ffe36e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            color: #7a1720;
            margin-bottom: 8px;
            font-size: 25px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #7a1720;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #7a1720;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5f1118;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #888;
        }

    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">SEI</div>

        <h1>Smart Election Integrity</h1>

        <p class="subtitle">
            Data Mining Based Voter Verification System
        </p>

        <form id="loginForm">

            <label for="username">Officer ID</label>

            <input
                type="text"
                id="username"
                placeholder="Enter Officer ID"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <div class="footer">
            Authorized Officer Access
        </div>

    </div>

    <script>

        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            /*
                Demo login credentials
            */

            if (username === "admin" && password === "admin123") {

                document.getElementById("message").textContent =
                    "Login successful!";

                document.getElementById("message").style.color =
                    "green";

                setTimeout(function() {

                    window.location.href = "dashboard.html";

                }, 500);

            }
            else {

                document.getElementById("message").textContent =
                    "Invalid Officer ID or Password.";

                document.getElementById("message").style.color =
                    "#7a1720";
            }

        });

    </script>

</body>

</html>
