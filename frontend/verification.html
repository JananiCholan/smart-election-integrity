
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voter Verification</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f7f7;
            color: #222;
        }

        .header {
            background: #7a1720;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            font-size: 26px;
        }

        .header p {
            margin-top: 5px;
            color: #ffe36e;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .voter-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .voter-card h2 {
            color: #7a1720;
            margin-bottom: 20px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .detail {
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .detail strong {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        .risk-box {
            padding: 20px;
            border-radius: 10px;
            background: #fff3cd;
            margin-top: 20px;
        }

        .risk-box h3 {
            color: #7a1720;
            margin-bottom: 10px;
        }

        .status {
            font-size: 22px;
            font-weight: bold;
            margin-top: 10px;
        }

        .verify-btn {
            margin-top: 25px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #7a1720;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .verify-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 700px) {

            .details {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 20px;
            }
        }

    </style>
</head>

<body>

    <div class="header">

        <h1>Voter Verification</h1>

        <p>
            Smart Election Integrity System
        </p>

    </div>


    <div class="container">

        <div class="search-box">

            <input
                type="text"
                id="voterSearch"
                placeholder="Enter Voter ID"
            >

        </div>


        <div class="voter-card">

            <h2>Voter Details</h2>

            <div class="details">

                <div class="detail">
                    <strong>Voter ID</strong>
                    <span id="voterId">-</span>
                </div>

                <div class="detail">
                    <strong>Name</strong>
                    <span id="voterName">-</span>
                </div>

                <div class="detail">
                    <strong>Date of Birth</strong>
                    <span id="dob">-</span>
                </div>

                <div class="detail">
                    <strong>Gender</strong>
                    <span id="gender">-</span>
                </div>

                <div class="detail">
                    <strong>Address</strong>
                    <span id="address">-</span>
                </div>

                <div class="detail">
                    <strong>Constituency</strong>
                    <span id="constituency">-</span>
                </div>

            </div>


            <div class="risk-box">

                <h3>Risk Analysis</h3>

                <p>
                    EFRI Score:
                    <strong id="efriScore">-</strong>
                </p>

                <p class="status" id="riskLevel">
                    -
                </p>

                <p id="reason">
                    No voter selected.
                </p>

            </div>


            <button class="verify-btn">
                Mark Verification Complete
            </button>

        </div>

    </div>
    <script src="verification.js"></script>

</body>
</html>
