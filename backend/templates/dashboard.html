
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Election Integrity System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f7f7;
            color: #222;
        }

        .header {
            background: #7a1720;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            font-size: 26px;
        }

        .header p {
            margin-top: 5px;
            color: #ffe36e;
        }

        .container {
            padding: 30px 40px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            border-top: 5px solid #e0b800;
        }

        .card h3 {
            color: #555;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 30px;
            font-weight: bold;
            color: #7a1720;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .section h2 {
            margin-bottom: 20px;
            color: #7a1720;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #7a1720;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .low {
            color: green;
            font-weight: bold;
        }

        .medium {
            color: #c58a00;
            font-weight: bold;
        }

        .high {
            color: #c00000;
            font-weight: bold;
        }

        @media (max-width: 900px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }

            table {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Smart Election Integrity System</h1>
        <p>Data Mining Based Voter Verification Dashboard</p>
    </div>

    <div class="container">

        <div class="cards">

            <div class="card">
                <h3>Total Voters</h3>
                <p id="totalVoters">0</p>
            </div>

            <div class="card">
                <h3>Low Risk</h3>
                <p id="lowRisk">0</p>
            </div>

            <div class="card">
                <h3>Medium Risk</h3>
                <p id="mediumRisk">0</p>
            </div>

            <div class="card">
                <h3>High Risk</h3>
                <p id="highRisk">0</p>
            </div>

        </div>

        <div class="section">

            <h2>Voter Risk Report</h2>
            <div style="margin-bottom: 20px;">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by Voter ID or Name"
                    style="
                    width: 100%;
                    padding: 12px;
                    border: 1px solid #ccc;
                    border-radius: 8px;
                    font-size: 16px;
                    "
                >
            </div>
            <div style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;">

    <button onclick="filterRisk('All')"
        style="padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer;">
        All
    </button>

    <button onclick="filterRisk('Low Risk')"
        style="padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer;">
        Low Risk
    </button>

    <button onclick="filterRisk('Medium Risk')"
        style="padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer;">
        Medium Risk
    </button>

    <button onclick="filterRisk('High Risk')"
        style="padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer;">
        High Risk
    </button>

</div>

            <table>

                <thead>
                    <tr>
                        <th>Voter ID</th>
                        <th>Name</th>
                        <th>Constituency</th>
                        <th>EFRI Score</th>
                        <th>Risk Level</th>
                        <th>Reason</th>
                    </tr>
                </thead>

                <tbody id="reportTable">
                    <tr>
                        <td colspan="6">Loading data...</td>
                    </tr>
                </tbody>

            </table>

                </div>

        <div style="
            margin-top: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        ">

            <button
                onclick="window.location.href='/verification'"
                style="
                    padding: 12px 22px;
                    background: #7a1720;
                    color: white;
                    border: none;
                    border-radius: 7px;
                    cursor: pointer;
                    font-size: 15px;
                    font-weight: bold;
                "
            >
                Voter Verification
            </button>

            <button
                onclick="window.location.href='/reports'"
                style="
                    padding: 12px 22px;
                    background: #e0b800;
                    color: #222;
                    border: none;
                    border-radius: 7px;
                    cursor: pointer;
                    font-size: 15px;
                    font-weight: bold;
                "
            >
                Risk Reports
            </button>

        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
